    <script>
      // Prevent benign dev-server WebSocket disconnects from surfacing as unhandled rejection errors
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event && (event.reason ? (event.reason.message || event.reason) : ''));
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('ws:') !== -1 || str.indexOf('wss:') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
